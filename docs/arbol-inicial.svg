<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="420" fill="#ffffff"/>
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">ABB: inserción 50, 30, 20, 40, 70, 60, 80</text>

  <!-- aristas -->
  <g stroke="#444" stroke-width="2.5" fill="none">
    <line x1="400" y1="100" x2="220" y2="190"/>
    <line x1="400" y1="100" x2="580" y2="190"/>
    <line x1="220" y1="210" x2="130" y2="300"/>
    <line x1="220" y1="210" x2="310" y2="300"/>
    <line x1="580" y1="210" x2="490" y2="300"/>
    <line x1="580" y1="210" x2="670" y2="300"/>
  </g>

  <!-- etiquetas izquierdo / derecho -->
  <g font-size="13" font-style="italic" fill="#555" text-anchor="middle">
    <text x="288" y="140">izquierdo</text>
    <text x="512" y="140">derecho</text>
    <text x="150" y="250">izquierdo</text>
    <text x="292" y="250">derecho</text>
    <text x="440" y="250">izquierdo</text>
    <text x="640" y="250">derecho</text>
  </g>

  <!-- raíz -->
  <circle cx="400" cy="80" r="30" fill="#f4b942" stroke="#8a5a00" stroke-width="3"/>
  <text x="400" y="87" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">50</text>
  <text x="455" y="75" font-size="14" font-weight="bold" fill="#8a5a00">RAÍZ</text>

  <!-- internos -->
  <circle cx="220" cy="190" r="30" fill="#bcd9f5" stroke="#1f5f99" stroke-width="3"/>
  <text x="220" y="197" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">30</text>
  <circle cx="580" cy="190" r="30" fill="#bcd9f5" stroke="#1f5f99" stroke-width="3"/>
  <text x="580" y="197" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">70</text>

  <!-- hojas -->
  <g fill="#b9e6b9" stroke="#2c7a2c" stroke-width="3">
    <circle cx="130" cy="330" r="30"/>
    <circle cx="310" cy="330" r="30"/>
    <circle cx="490" cy="330" r="30"/>
    <circle cx="670" cy="330" r="30"/>
  </g>
  <g text-anchor="middle" font-size="20" font-weight="bold" fill="#222">
    <text x="130" y="337">20</text>
    <text x="310" y="337">40</text>
    <text x="490" y="337">60</text>
    <text x="670" y="337">80</text>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="bold" fill="#2c7a2c">
    <text x="130" y="380">HOJA</text>
    <text x="310" y="380">HOJA</text>
    <text x="490" y="380">HOJA</text>
    <text x="670" y="380">HOJA</text>
  </g>

  <!-- leyenda -->
  <g font-size="13" fill="#222">
    <circle cx="30" cy="395" r="8" fill="#f4b942" stroke="#8a5a00" stroke-width="2"/><text x="45" y="400">Raíz</text>
    <circle cx="100" cy="395" r="8" fill="#bcd9f5" stroke="#1f5f99" stroke-width="2"/><text x="115" y="400">Nodo interno</text>
    <circle cx="220" cy="395" r="8" fill="#b9e6b9" stroke="#2c7a2c" stroke-width="2"/><text x="235" y="400">Hoja</text>
  </g>
</svg>
